name: Keep only the latest deployment

# Vercel's Git integration deploys `main` to production only (see vercel.json: preview builds are skipped).
# When that production deployment succeeds, delete every older deployment.
on: deployment_status

permissions: {}

concurrency:
  group: vercel-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Delete older deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          KEEP_DEPLOYMENT: ${{ github.event.deployment_status.target_url }}
        run: node scripts/cleanup-deployments.mjs
